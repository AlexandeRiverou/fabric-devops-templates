name: Promote Microsoft Fabric DEV to TEST or PROD (example)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment pipeline target stage
        required: true
        type: choice
        options:
          - test
          - prod
      what_if:
        description: Preview only; do not send the deploy request
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  promote:
    name: Promote DEV to ${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
    uses: OWNER/fabric-devops-templates/.github/workflows/fabric-promote-to-stage.yml@<PINNED_COMMIT_SHA>
    with:
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      github_environment: ${{ inputs.target == 'prod' && 'fabric-prod' || 'fabric-test' }}
      pipeline_name: ${{ vars.FABRIC_DEPLOYMENT_PIPELINE_NAME }}
      source_stage_name: ${{ vars.FABRIC_DEV_STAGE_NAME }}
      target_stage_name: ${{ vars[inputs.target == 'prod' && 'FABRIC_PROD_STAGE_NAME' || 'FABRIC_TEST_STAGE_NAME'] }}
      excluded_resource_types: ${{ vars.FABRIC_EXCLUDED_RESOURCE_TYPES }}
      excluded_folder_reference: ${{ vars.FABRIC_EXCLUDED_FOLDER_REFERENCE }}
      timeout_minutes: 60
      what_if: ${{ inputs.what_if }}
    # The called workflow binds the job to fabric-test or fabric-prod. Configure
    # approval rules on both GitHub Environments, especially fabric-prod.
